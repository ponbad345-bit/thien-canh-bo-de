<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thiền Cảnh Bồ Đề — Game 3D</title>
<style>
  :root { color-scheme: dark; --gold:#f5d58a; --panel:rgba(20,25,38,.82); }
  * { box-sizing:border-box }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; font-family:system-ui,-apple-system,Segoe UI,sans-serif; background:#111827; color:#fff }
  #scene { position:fixed; inset:0 }
  canvas { display:block; width:100%; height:100% }
  .top { position:fixed; top:14px; left:14px; right:14px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; pointer-events:none }
  .brand,.panel,.hint { background:var(--panel); border:1px solid rgba(245,213,138,.25); backdrop-filter:blur(12px); box-shadow:0 8px 30px #0005; border-radius:16px }
  .brand { padding:12px 16px; max-width:min(440px,70vw) }
  .brand strong { display:block; color:var(--gold); letter-spacing:.08em; font-size:14px }
  .brand span { display:block; opacity:.8; font-size:12px; margin-top:3px }
  .panel { pointer-events:auto; padding:12px; width:min(300px,calc(100vw - 28px)); }
  .panel h2 { margin:0 0 9px; font-size:14px; color:var(--gold); font-weight:700 }
  button { border:1px solid #d9b86f66; border-radius:10px; padding:10px 11px; color:#fff; background:#76552d; font-weight:650; cursor:pointer; font-size:12px }
  button:hover { background:#98703a }
  button.secondary { background:#263247 }
  .buttons { display:grid; grid-template-columns:1fr 1fr; gap:7px }
  .stats { display:flex; justify-content:space-between; font-size:12px; opacity:.85; margin:10px 1px 0 }
  #people { max-height:150px; overflow:auto; margin-top:8px; font-size:12px; line-height:1.7; color:#e8dfc8 }
  .hint { position:fixed; left:50%; transform:translateX(-50%); bottom:14px; padding:9px 14px; font-size:12px; text-align:center; white-space:normal; width:max-content; max-width:calc(100vw - 28px); color:#eee4cf }
  .pill { display:inline-block; border-radius:99px; padding:3px 7px; background:#d6ad5b22; color:var(--gold); font-size:10px; margin-left:5px }
  @media(max-width:650px) {
    .top { flex-direction:column; align-items:flex-start }
    .panel { width:230px }
    .brand { max-width:230px }
    .hint { bottom:10px; font-size:11px }
  }
</style>
</head>
<body>
<div id="scene"></div>
<div class="top">
  <div class="brand"><strong>☸ THIỀN CẢNH BỒ ĐỀ</strong><span>Không gian chùa 3D · Camera xoay 360° · Bản thử nghiệm 1.0</span></div>
  <section class="panel">
    <h2>Điều khiển thế giới</h2>
    <div class="buttons">
      <button id="add">＋ Thêm người xem</button>
      <button id="reset" class="secondary">⟳ Đặt lại camera</button>
      <button id="bell" class="secondary">♬ Nghe tiếng chuông</button>
      <button id="clear" class="secondary">Xóa nhân vật</button>
    </div>
    <div class="stats"><span>Nhân vật trong sân</span><b id="count">0 / 10</b></div>
    <div id="people">Chưa có người xem. Bấm “Thêm người xem” để thử.</div>
  </section>
</div>
<div class="hint">Kéo để xoay 360° · Cuộn hoặc chụm hai ngón để phóng to/thu nhỏ · Nhấn “Thêm người xem” để thử nhân vật</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const host = document.getElementById('scene');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101b2a);
scene.fog = new THREE.FogExp2(0x172438, 0.012);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, .1, 300);
camera.position.set(22, 17, 25);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
host.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0,3,0);
controls.enableDamping = true;
controls.dampingFactor = .06;
controls.minDistance = 9;
controls.maxDistance = 58;
controls.maxPolarAngle = Math.PI*.48;

scene.add(new THREE.HemisphereLight(0xbdd8ff,0x55402b,2.0));
const moon = new THREE.DirectionalLight(0xffdfa0,3.2);
moon.position.set(-12,24,10); moon.castShadow=true; moon.shadow.mapSize.set(2048,2048);
moon.shadow.camera.left=-30; moon.shadow.camera.right=30; moon.shadow.camera.top=30; moon.shadow.camera.bottom=-30;
scene.add(moon);
const warm = new THREE.PointLight(0xffc76a,45,32); warm.position.set(0,8,0); scene.add(warm);

const mat=(color,roughness=.8,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const stone=mat(0x777c83), paleStone=mat(0xb7a88b), darkWood=mat(0x493026), red=mat(0x842e28), roofMat=mat(0x253e48,.65), gold=mat(0xd7a94e,.35,.65), leaf=mat(0x477d53), leafLight=mat(0x80a95d), water= new THREE.MeshStandardMaterial({color:0x244d60,roughness:.22,metalness:.25,transparent:true,opacity:.88});
const ground=new THREE.Mesh(new THREE.CircleGeometry(32,96),mat(0x34483e)); ground.rotation.x=-Math.PI/2; ground.position.y=-.12; ground.receiveShadow=true; scene.add(ground);
const courtyard=new THREE.Mesh(new THREE.CircleGeometry(16,80),mat(0x9b907c)); courtyard.rotation.x=-Math.PI/2; courtyard.position.y=.01; courtyard.receiveShadow=true; scene.add(courtyard);

// Stone floor grid
for(let x=-14;x<=14;x+=2) for(let z=-13;z<=13;z+=2){
 const tile=new THREE.Mesh(new THREE.BoxGeometry(1.94,.09,1.94),mat(((x+z)/2)%2===0?0xb6a88f:0xa99a80));
 tile.position.set(x,.09,z); tile.receiveShadow=true; scene.add(tile);
}
// Pathway
const path=new THREE.Mesh(new THREE.BoxGeometry(5,.12,14),paleStone); path.position.set(0,.17,7); path.receiveShadow=true; scene.add(path);
for(let z=1;z<14;z+=2){ const seam=new THREE.Mesh(new THREE.BoxGeometry(4.9,.02,.035),stone); seam.position.set(0,.24,z); scene.add(seam); }

// Temple hall at back
function box(w,h,d,material,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;}
box(17,5,6,darkWood,0,2.7,-11);
box(18,.45,7,stone,0,.25,-11);
for(let x=-7;x<=7;x+=3.5){
 const c=new THREE.Mesh(new THREE.CylinderGeometry(.22,.28,4.6,12),red);c.position.set(x,2.8,-7.9);c.castShadow=true;scene.add(c);
}
box(13,2.6,.25,mat(0x2b1d1a),0,2.2,-7.88);
for(let x=-5.5;x<=5.5;x+=2.2){
 const door=box(1.45,2.2,.12,mat(0x6b3828),x,2.1,-7.7);
 const panel=box(.08,2,.05,gold,x,2.1,-7.6);
}
function roof(levelY,width,depth,z){
 const base=new THREE.Mesh(new THREE.ConeGeometry(width*.72,1.25,4),roofMat);
 base.rotation.y=Math.PI/4; base.scale.set(1,.85,depth/width); base.position.set(0,levelY,z);base.castShadow=true;scene.add(base);
 const ridge=box(width*.72,.22,.28,gold,0,levelY+.62,z);
}
roof(6.1,20,9,-10.6);
roof(7.25,15,7,-10.6);
for(let x of [-9.5,9.5]){const fin=new THREE.Mesh(new THREE.ConeGeometry(.22,2,8),gold);fin.position.set(x,6.8,-10.6);scene.add(fin);}

// Buddha pedestal and lotus
const pedestal= new THREE.Mesh(new THREE.CylinderGeometry(2.3,2.7,.85,12),gold);pedestal.position.set(0,.75,-1.2);pedestal.castShadow=true;scene.add(pedestal);
const lotus=new THREE.Mesh(new THREE.CylinderGeometry(1.75,2.05,.55,12),mat(0xe4c17a,.45,.35));lotus.position.set(0,1.35,-1.2);scene.add(lotus);
for(let i=0;i<12;i++){
 const a=i*Math.PI*2/12;
 const petal=new THREE.Mesh(new THREE.SphereGeometry(.55,16,12),mat(0xf0d58e,.5,.2));
 petal.scale.set(.48,.22,1.05);petal.position.set(Math.cos(a)*1.65,1.55,-1.2+Math.sin(a)*1.65);petal.rotation.y=-a;scene.add(petal);
}
// Stylized seated Buddha, intentionally symbolic and respectful
const buddhaGroup=new THREE.Group(); buddhaGroup.position.set(0,1.6,-1.2);scene.add(buddhaGroup);
function part(geo,material,x,y,z,sx=1,sy=1,sz=1){const m=new THREE.Mesh(geo,material);m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.castShadow=true;m.receiveShadow=true;buddhaGroup.add(m);return m;}
const skin=mat(0xd8ad70,.48,.2), robe=mat(0xc58b35,.55,.25);
part(new THREE.SphereGeometry(1,32,24),robe,0,.85,0,1.28,.42,.83); // crossed legs
part(new THREE.SphereGeometry(.72,32,24),robe,0,1.55,0,.72,1.05,.62); // torso
part(new THREE.SphereGeometry(.48,28,22),skin,0,2.75,0,.82,1,.72); // head
part(new THREE.SphereGeometry(.49,24,16),mat(0x30231d),0,3.08,-.02,.95,.38,.8); // hair cap
const ushnisha=new THREE.Mesh(new THREE.SphereGeometry(.18,20,16),mat(0x30231d));ushnisha.position.set(0,3.42,0);buddhaGroup.add(ushnisha);
part(new THREE.SphereGeometry(.12,16,12),skin,0,2.75,.55,.6,.12,.3); // nose/mouth region
// ears
for(const x of [-.58,.58])part(new THREE.SphereGeometry(.18,16,12),skin,x,2.68,0,.55,1,.55);
const halo=new THREE.Mesh(new THREE.TorusGeometry(1.35,.12,16,64),gold);halo.position.set(0,2.75,-.48);buddhaGroup.add(halo);
const haloGlow=new THREE.PointLight(0xffcf72,22,13);haloGlow.position.set(0,4,-1.7);scene.add(haloGlow);

// Bodhi tree trunk and canopy
const trunkMat=mat(0x5b3928);
const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.8,1.25,8,16),trunkMat);trunk.position.set(0,4.1,-1.4);trunk.castShadow=true;scene.add(trunk);
for(let i=0;i<8;i++){
 const a=i*Math.PI/4;
 const branch=new THREE.Mesh(new THREE.CylinderGeometry(.16,.34,5,10),trunkMat);
 branch.position.set(Math.cos(a)*2,6.3,-1.4+Math.sin(a)*2);branch.rotation.z=Math.cos(a)*-.65;branch.rotation.x=Math.sin(a)*.65;branch.castShadow=true;scene.add(branch);
}
for(let i=0;i<42;i++){
 const a=i*2.399, r=2.2+Math.sqrt(i)*.72;
 const x=Math.cos(a)*r, z=-1.4+Math.sin(a)*r, y=8.1+(Math.sin(i*1.7)*1.6);
 const s=.9+(i%5)*.18;
 const crown=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),i%4===0?leafLight:leaf);
 crown.position.set(x,y,z);crown.scale.set(s*1.35,s*.8,s);crown.castShadow=true;scene.add(crown);
}
// hanging bodhi leaves
for(let i=0;i<26;i++){
 const a=i*2.4,r=3.3+(i%4)*.5;
 const l=new THREE.Mesh(new THREE.SphereGeometry(.23,12,8),leafLight);
 l.scale.set(.55,1.5,.12);l.position.set(Math.cos(a)*r,6.3+(i%3)*.4,-1.4+Math.sin(a)*r);l.rotation.z=Math.cos(a)*.5;scene.add(l);
}

// Lotus ponds
for(const x of [-10,10]){
 const pond=new THREE.Mesh(new THREE.CylinderGeometry(3.4,3.4,.3,48),water);pond.position.set(x,.12,1);scene.add(pond);
 const rim=new THREE.Mesh(new THREE.TorusGeometry(3.35,.16,12,64),paleStone);rim.rotation.x=Math.PI/2;rim.position.set(x,.28,1);scene.add(rim);
 for(let i=0;i<9;i++){
  const a=i*2.4,r=1.2+(i%3)*.55;
  const pad=new THREE.Mesh(new THREE.CircleGeometry(.35,16),leaf);pad.rotation.x=-Math.PI/2;pad.position.set(x+Math.cos(a)*r,.31,1+Math.sin(a)*r);scene.add(pad);
  const flower=new THREE.Mesh(new THREE.SphereGeometry(.22,12,8),mat(0xf3b5c5));flower.scale.set(1,.35,1);flower.position.set(x+Math.cos(a)*r,.43,1+Math.sin(a)*r);scene.add(flower);
 }
}
// Lanterns
function lantern(x,z){
 const base=new THREE.Mesh(new THREE.CylinderGeometry(.48,.58,.25,8),stone);base.position.set(x,.35,z);scene.add(base);
 const stem=new THREE.Mesh(new THREE.CylinderGeometry(.12,.2,1.25,8),paleStone);stem.position.set(x,1.05,z);scene.add(stem);
 const body=new THREE.Mesh(new THREE.BoxGeometry(.85,.7,.85),mat(0x75634c));body.position.set(x,1.95,z);scene.add(body);
 const light=new THREE.PointLight(0xffb957,8,7);light.position.set(x,2,z);scene.add(light);
 const cap=new THREE.Mesh(new THREE.ConeGeometry(.75,.42,4),stone);cap.position.set(x,2.5,z);cap.rotation.y=Math.PI/4;scene.add(cap);
}
for(const x of [-7,7])for(const z of [-4,3,9])lantern(x,z);

// Decorative stones and small trees
for(let i=0;i<18;i++){
 const x=(i%2?1:-1)*(12+(i%3)), z=-8+(i*2.1)%21;
 const b=new THREE.Mesh(new THREE.DodecahedronGeometry(.55+(i%3)*.18,0),mat(0x6e796d));b.position.set(x,.45,z);b.scale.y=.7;scene.add(b);
}
// Gate
for(let x of [-4.8,4.8])box(.5,3,.5,red,x,1.5,13);
box(11,.35,.8,darkWood,0,3,13);
const gateRoof=new THREE.Mesh(new THREE.ConeGeometry(6.4,.9,4),roofMat);gateRoof.rotation.y=Math.PI/4;gateRoof.scale.set(1,.65,.22);gateRoof.position.set(0,3.45,13);scene.add(gateRoof);

// Avatars
const visitors=[];
const robes=[0x8b5a37,0x416c7a,0xb08a45,0x6c4d78,0x54734f,0x9b6654,0xeee0bd];
const names=['An Nhiên','Minh Tâm','Bình An','Tuệ Minh','Hoa Sen','Thiện Duyên','Tâm An','Diệu Hương','Thanh Tịnh','Phúc Lành'];
function createVisitor(name,index){
 const g=new THREE.Group();scene.add(g);
 const robeMat=mat(robes[index%robes.length]);
 const skinMat=mat(index%3===0?0xd8ad82:0xe4bd94);
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.38,.8,5,10),robeMat);body.position.y=1.05;body.castShadow=true;g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.32,16,12),skinMat);head.position.y=1.9;head.castShadow=true;g.add(head);
 const hair=new THREE.Mesh(new THREE.SphereGeometry(.33,16,10),mat(index%3===0?0x32251e:0x3c3028));hair.scale.y=.55;hair.position.y=2.08;g.add(hair);
 const armMat=robeMat;
 const arms=[];
 for(const side of [-1,1]){
  const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.62,4,8),armMat);arm.position.set(side*.48,1.25,.05);arm.rotation.z=side*-.22;arm.castShadow=true;g.add(arm);arms.push(arm);
 }
 const label=document.createElement('div');
 label.textContent=name;
 Object.assign(label.style,{position:'fixed',left:'0',top:'0',padding:'4px 8px',borderRadius:'20px',background:'rgba(18,25,34,.82)',border:'1px solid #e5c77a',color:'#ffe5a6',fontSize:'12px',fontWeight:'700',pointerEvents:'none',whiteSpace:'nowrap',display:'none',textShadow:'0 1px 3px #000'});
 document.body.appendChild(label);
 const startX=(Math.random()-.5)*3, startZ=12.2;
 g.position.set(startX,0,startZ);
 const targetX=(Math.random()-.5)*4.2, targetZ=3.2+(index%3)*.8;
 visitors.push({g,label,name,arms,targetX,targetZ,phase:'walk',timer:0,seed:Math.random()*6.28});
}
function addVisitor(){
 if(visitors.length>=10){alert('Sân chùa đã đủ 10 nhân vật trong bản thử nghiệm.');return;}
 const i=visitors.length;
 createVisitor(names[i],i);
 updatePeople();
}
function updatePeople(){
 document.getElementById('count').textContent=visitors.length+' / 10';
 document.getElementById('people').innerHTML=visitors.length?visitors.map((v,i)=>`${i+1}. ${v.name} — ${v.phase==='walk'?'đang đi vào':'đang quỳ lễ'}`).join('<br>'):'Chưa có người xem. Bấm “Thêm người xem” để thử.';
}
document.getElementById('add').onclick=addVisitor;
document.getElementById('clear').onclick=()=>{while(visitors.length){const v=visitors.pop();scene.remove(v.g);v.label.remove();}updatePeople();};
document.getElementById('reset').onclick=()=>{camera.position.set(22,17,25);controls.target.set(0,3,0);controls.update();};
document.getElementById('bell').onclick=()=>{
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 const ctx=new AC(), osc=ctx.createOscillator(), gain=ctx.createGain();
 osc.type='sine';osc.frequency.setValueAtTime(520,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(180,ctx.currentTime+2.4);
 gain.gain.setValueAtTime(.0001,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.22,ctx.currentTime+.03);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+3);
 osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+3.1);
};

// Stars
const stars=new THREE.BufferGeometry(), starPos=[];
for(let i=0;i<500;i++)starPos.push((Math.random()-.5)*150,12+Math.random()*55,(Math.random()-.5)*150);
stars.setAttribute('position',new THREE.Float32BufferAttribute(starPos,3));
scene.add(new THREE.Points(stars,new THREE.PointsMaterial({color:0xffe6b0,size:.16,transparent:true,opacity:.8})));

// Floating golden motes
const motes=[];
for(let i=0;i<70;i++){
 const m=new THREE.Mesh(new THREE.SphereGeometry(.045,8,8),new THREE.MeshBasicMaterial({color:0xffd778}));
 m.position.set((Math.random()-.5)*24,1+Math.random()*11,(Math.random()-.5)*24);scene.add(m);motes.push(m);
}
const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const t=clock.getElapsedTime(), dt=Math.min(clock.getDelta(),.04);
 motes.forEach((m,i)=>{m.position.y+=Math.sin(t+i)*.0018;m.position.x+=Math.sin(t*.4+i)*.001;});
 visitors.forEach((v,i)=>{
  v.timer+=dt;
  if(v.phase==='walk'){
   const dx=v.targetX-v.g.position.x,dz=v.targetZ-v.g.position.z,dist=Math.hypot(dx,dz);
   if(dist>.18){v.g.position.x+=dx/dist*dt*1.7;v.g.position.z+=dz/dist*dt*1.7;v.g.rotation.y=Math.atan2(dx,dz);v.g.position.y=Math.abs(Math.sin(t*7+i))*0.04;}
   else {v.phase='kneel';v.timer=0;updatePeople();}
  } else {
   const k=Math.min(v.timer/1.1,1);
   v.g.rotation.x=-.05-k*.62;
   v.g.position.y=-k*.28;
   v.arms.forEach((a,j)=>{a.rotation.z=(j===0?1:-1)*(.22+k*.5);a.rotation.x=-.6-k*.3;});
  }
  const p=v.g.position.clone();p.y+=2.5;p.project(camera);
  const x=(p.x*.5+.5)*innerWidth,y=(-p.y*.5+.5)*innerHeight;
  v.label.style.left=x+'px';v.label.style.top=y+'px';v.label.style.display=(p.z<1)?'block':'none';
 });
 controls.update();renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
